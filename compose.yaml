services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: festpass
      POSTGRES_DB: festpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - festpass-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - data

  backend:
    image: satviksri/fest-backend:1.0.0
    environment:
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REGNO: "202401100100228"
      APP_VERSION: "1.0.0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - web

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "8028:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - web

volumes:
  festpass-data:

networks:
  web:
  data:
